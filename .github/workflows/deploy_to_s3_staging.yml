# This workflow will build the static files
# and upload them to the given s3 bucket

on:
  pull_request:
  push:
    branches: ["main"]

name: Deploy to staging

jobs:
  build_and_deploy:
    name: Deploy
    environment:
      name: Staging

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.OS }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-build-
            ${{ runner.OS }}-

      - name: Install
        run: npm install

      - name: Build
        env:
          VUE_APP_BACKEND: ${{ secrets.VUE_APP_BACKEND }}
          VUE_APP_PORTAL_BACKEND: ${{ secrets.VUE_APP_PORTAL_BACKEND }}
          VUE_APP_PORTAL_FRONTEND: ${{ secrets.VUE_APP_PORTAL_FRONTEND }}
        run: npm run build-staging

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Hashed js/css are immutable; index.html must never be cached, or students
      # keep running an old bundle against a newer API after a release.
      - name: Deploy static site to S3 bucket
        run: |
          aws s3 sync ./dist s3://question-set-player-staging --delete --acl public-read --exclude "js/*" --exclude "css/*" --exclude "index.html"
          aws s3 sync ./dist/js s3://question-set-player-staging/js --delete --acl public-read --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist/css s3://question-set-player-staging/css --delete --acl public-read --cache-control "public, max-age=31536000, immutable"
          aws s3 cp ./dist/index.html s3://question-set-player-staging/index.html --acl public-read --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        continue-on-error: true
        run: aws cloudfront create-invalidation --distribution-id E1HNFHAZ8KYJ7R --paths "/index.html" "/"
